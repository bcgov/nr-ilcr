name: Merge

on:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - '.github/graphics/**'

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions: {}

jobs:
  init:
    name: Initialize
    permissions:
      contents: read
      pull-requests: read
    outputs:
      pr: ${{ steps.pr.outputs.pr }}
      backend_image: ${{ steps.images.outputs.backend_image }}
      frontend_image: ${{ steps.images.outputs.frontend_image }}
      capture_attempt: ${{ steps.images.outputs.capture_attempt }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # PR images are built once; synchronize the PR with main before merging.
      # Capture their immutable digests before TEST, and release exactly that pair.
      # Get PR number for squash merges to main
      - id: pr
        uses: bcgov/action-get-pr@28b0adf8e4d40720d41f9c87356ce24b0a4bd6af # v0.3.1
      - name: Resolve candidate image digests
        id: images
        env:
          PR_NUMBER: ${{ steps.pr.outputs.pr }}
        run: node .github/scripts/release-images.mjs capture

  # TEST deploys run on every merge and fail visibly if misconfigured.
  deploy-test:
    name: TEST Deploys (${{ needs.init.outputs.pr }})
    needs: [init]
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-deploy.yml
    secrets: inherit
    with:
      environment: test
      target: test
      tag: ${{ needs.init.outputs.pr }}
      backend_image: ${{ needs.init.outputs.backend_image }}
      frontend_image: ${{ needs.init.outputs.frontend_image }}

  tests:
    name: Tests
    if: needs.deploy-test.result == 'success'
    needs: [deploy-test]
    uses: ./.github/workflows/reusable-tests.yml
    # inherit: the e2e-full job needs OC_NAMESPACE_TOOLS/OC_TOKEN_TOOLS for the
    # tools-namespace Oracle it port-forwards to.
    secrets: inherit
    with:
      target: test

  release-candidate:
    name: Record tested release candidate
    needs: [init, tests]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Record tested images
        env:
          CAPTURE_ATTEMPT: ${{ needs.init.outputs.capture_attempt }}
          BACKEND_IMAGE: ${{ needs.init.outputs.backend_image }}
          FRONTEND_IMAGE: ${{ needs.init.outputs.frontend_image }}
        run: node .github/scripts/release-images.mjs record "$RUNNER_TEMP/release-candidate.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-candidate-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-candidate.json
          if-no-files-found: error
      - name: Show how to release this commit
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          {
            echo "### Ready for PROD"
            echo
            echo "This commit passed TEST. To release it, tag it with the next version:"
            echo
            echo '```bash'
            echo "git fetch origin && git tag v1.0.0 $RELEASE_SHA && git push origin v1.0.0"
            echo '```'
            echo
            echo "Or use **Releases → Draft a new release**: type the new tag, set **Target** to this commit, and publish."
            echo
            echo "Then open **Actions → Release PROD → Run workflow**, keep branch \`main\`, and enter the tag."
          } >> "$GITHUB_STEP_SUMMARY"

  results:
    name: Merge Results
    needs: [init, deploy-test, tests, release-candidate]
    if: always()
    runs-on: ubuntu-slim
    timeout-minutes: 1
    steps:
      - name: Log Job Results Context
        run: |
          echo "=== Upstream Job Statuses ==="
          echo '${{ toJson(needs) }}'

      - name: Evaluate Overall Status
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "❌ Merge pipeline failure: at least one required job failed or was cancelled."
          exit 1

      - name: Success Message
        run: echo "✅ All merge pipeline jobs passed or were intentionally skipped!"
