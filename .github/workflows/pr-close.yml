name: PR Closed

on:
  pull_request:
    types: [closed]

concurrency:
  # PR open and close use the same group, allowing only one at a time
  group: ${{ github.event.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  # ZONE for OpenShift objects is the PR number mapped into 0-49 (see
  # pr-open.yml), so cleanup must target that zone, not the raw PR number.
  init:
    name: Initialize
    runs-on: ubuntu-slim
    timeout-minutes: 1
    outputs:
      zone: ${{ steps.zone.outputs.zone }}
    steps:
      - id: zone
        run: echo "zone=$(( ${{ github.event.number }} % 50 ))" >> $GITHUB_OUTPUT

  promotion:
    name: Image Promotion
    uses: bcgov/quickstart-openshift-helpers/.github/workflows/.pr-close.yml@a11ad3d1b9288fb40757c4314a62eb86ff227931 # v1.2.1
    permissions:
      packages: write
    with:
      # database is promoted too so its `latest` tag stays current for
      # tag_fallback in pr-open builds. Its OpenShift objects live in the
      # tools namespace under app=<repo>-tools, so PR cleanup never touches them.
      packages: backend frontend database

  # A `uses:` job cannot attach an environment, and the OpenShift values live only in the dev
  # environment, so cleanup runs here rather than in the helper.
  cleanup:
    name: Cleanup PR OpenShift Resources
    needs: [init]
    runs-on: ubuntu-slim
    timeout-minutes: 10
    environment:
      name: dev
      deployment: false
    steps:
      - name: Delete this PR's OpenShift resources
        uses: bcgov/action-oc-runner@111868d1fc50db0a40417ba321d865ef5c931bbd # v1.7.0
        with:
          oc_namespace: ${{ secrets.oc_namespace }}
          oc_token: ${{ secrets.oc_token }}
          oc_server: ${{ vars.oc_server }}
          commands: |
            set -euo pipefail
            REPO="${{ github.event.repository.name }}"
            ZONE="${{ needs.init.outputs.zone }}"
            # Resources are labeled with three app values: ${NAME}-${ZONE} (init),
            # ${NAME}-backend-${ZONE} and ${NAME}-frontend-${ZONE} (deploys).
            for name in "${REPO}-${ZONE}" "${REPO}-backend-${ZONE}" "${REPO}-frontend-${ZONE}"; do
              oc delete all,cm,pvc,secret,networkpolicy -l "app=${name}" --ignore-not-found
            done
