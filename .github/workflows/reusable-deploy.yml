# Reusable Deploy - Lite Mode Verification
name: Reusable Deploy

on:
  workflow_call:
    inputs:
      environment:
        description: GitHub/OpenShift environment
        default: ""
        type: string
      target:
        description: Deployment target; usually PR number, test or prod
        default: ${{ github.event.number }}
        type: string
      tag:
        description: Container tag
        default: ${{ github.event.number }}
        type: string
      backend_image:
        description: Full backend image reference, optionally pinned by digest
        default: ""
        type: string
      frontend_image:
        description: Full frontend image reference, optionally pinned by digest
        default: ""
        type: string
      source_ref:
        description: Selected tested commit whose deployment templates should be used
        default: ""
        type: string
      triggers:
        description: Triggers for deployment
        default: ""
        type: string

    # Secrets come via `secrets: inherit` so environment-scoped values
    # (test/prod) resolve correctly; a `uses:` job cannot set `environment:`,
    # so explicitly passed secrets would only ever see repo-level values.

    outputs:
      triggered:
        description: Has deployment been triggered?
        value: ${{ jobs.init.outputs.triggered }}

permissions: {}

env:
  OC_PROCESS_FLAGS: ${{ inputs.source_ref != '' && inputs.source_ref != github.sha && '--ignore-unknown-parameters' || '' }}

jobs:
  init:
    name: Deploy (init)
    environment:
      name: ${{ inputs.environment }}
      deployment: ${{ inputs.target != 'prod' }}
    outputs:
      triggered: ${{ steps.deploy.outputs.triggered }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      # An environment secret replaces the inherited repository secret only when it exists. Without
      # this check, a missing environment secret would fall back to the repository-level value of the
      # same name. PR deploys use the dev environment.
      - name: Validate OpenShift namespace
        if: ${{ inputs.environment != '' }}
        env:
          DEPLOY_ENV: ${{ inputs.environment }}
          OC_NAMESPACE: ${{ secrets.OC_NAMESPACE }}
        run: |
          if [[ "$OC_NAMESPACE" != *-"$DEPLOY_ENV" ]]; then
            echo "::error title=Wrong OpenShift namespace::OC_NAMESPACE must be the ${DEPLOY_ENV} namespace, ending in -${DEPLOY_ENV}."
            exit 1
          fi

      # Release PROD has already refused repository-level copies of these, so a value here can only
      # come from the prod environment. Fail rather than deploy PROD with any of them missing.
      - name: Require PROD values
        if: ${{ inputs.target == 'prod' }}
        env:
          ORACLEDB_HOST: ${{ secrets.ORACLEDB_HOST }}
          ORACLEDB_SERVICENAME: ${{ secrets.ORACLEDB_SERVICENAME }}
          ORACLEDB_USERNAME: ${{ secrets.ORACLEDB_USERNAME }}
          ORACLEDB_PASSWORD: ${{ secrets.ORACLEDB_PASSWORD }}
          ILCR_OIDC_ISSUER_URI: ${{ vars.ILCR_OIDC_ISSUER_URI }}
          ILCR_OIDC_CLIENT_ID: ${{ vars.ILCR_OIDC_CLIENT_ID }}
        run: |
          set -euo pipefail
          for name in ORACLEDB_HOST ORACLEDB_SERVICENAME ORACLEDB_USERNAME ORACLEDB_PASSWORD ILCR_OIDC_ISSUER_URI ILCR_OIDC_CLIENT_ID; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::${name} must be set in the prod GitHub Environment"
              exit 1
            fi
          done

      # Check both images before anything rolls out, so a bad frontend reference cannot leave
      # a new backend running beside the old frontend. PR deploys (dev) use their head-SHA tags.
      - name: Validate release images
        if: ${{ inputs.environment != '' && inputs.environment != 'dev' }}
        env:
          BACKEND_IMAGE: ${{ inputs.backend_image }}
          FRONTEND_IMAGE: ${{ inputs.frontend_image }}
          IMAGE_REPOSITORY: ghcr.io/${{ github.repository }}
        run: |
          for release in "backend=$BACKEND_IMAGE" "frontend=$FRONTEND_IMAGE"; do
            component="${release%%=*}"
            if [[ ! "${release#*=}" =~ ^"$IMAGE_REPOSITORY/$component"@sha256:[a-f0-9]{64}$ ]]; then
              echo "::error::TEST and PROD require the repository's ${component} image pinned by SHA-256 digest."
              exit 1
            fi
          done

      # common/openshift.init.yml pastes these values into JavaScript string
      # literals in the frontend config.js, and a template cannot escape them,
      # so every value that reaches that file must match a strict pattern.
      - name: Validate SSO configuration
        env:
          APP_ENV: ${{ inputs.environment || 'dev' }}
          OIDC_ISSUER_URI: ${{ vars.ILCR_OIDC_ISSUER_URI }}
          OIDC_CLIENT_ID: ${{ vars.ILCR_OIDC_CLIENT_ID }}
          OIDC_SITEMINDER_LOGOUT_URL: ${{ vars.ILCR_OIDC_SITEMINDER_LOGOUT_URL }}
        run: |
          if [[ ! "$OIDC_ISSUER_URI" =~ ^https://[A-Za-z0-9.-]+(:[0-9]+)?/(auth/)?realms/[A-Za-z0-9._-]+$ ]] ||
             [[ ! "$OIDC_CLIENT_ID" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "::error::ILCR_OIDC_ISSUER_URI and ILCR_OIDC_CLIENT_ID must identify the provisioned CSS client"
            exit 1
          fi
          # Optional: blank selects the logontest7/logon7 default in the frontend.
          if [[ -n "$OIDC_SITEMINDER_LOGOUT_URL" ]] &&
             [[ ! "$OIDC_SITEMINDER_LOGOUT_URL" =~ ^https://[A-Za-z0-9.-]+(:[0-9]+)?(/[A-Za-z0-9._/-]*)?$ ]]; then
            echo "::error::ILCR_OIDC_SITEMINDER_LOGOUT_URL must be an https URL without a query or fragment"
            exit 1
          fi
          if [[ ! "$APP_ENV" =~ ^(dev|test|prod)$ ]]; then
            echo "::error::The deployment environment must be dev, test or prod"
            exit 1
          fi
          # Each environment trusts only its own SSO realm, so a fallen-back or copied issuer cannot
          # make PROD accept DEV or TEST tokens.
          case "$APP_ENV" in
            prod) sso_host=loginproxy.gov.bc.ca ;;
            test) sso_host=test.loginproxy.gov.bc.ca ;;
            *) sso_host=dev.loginproxy.gov.bc.ca ;;
          esac
          if [[ "$OIDC_ISSUER_URI" != "https://$sso_host/"* ]]; then
            echo "::error::ILCR_OIDC_ISSUER_URI must be the $APP_ENV SSO realm on $sso_host"
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ inputs.source_ref || github.sha }}
      - name: Stage init template
        run: |
          mkdir -p "$RUNNER_TEMP/deploy-templates"
          cp common/openshift.init.yml "$RUNNER_TEMP/deploy-templates/init.yml"
      - name: Validate PROD settings
        if: ${{ inputs.target == 'prod' }}
        env:
          DEPLOY_ENV: ${{ inputs.environment }}
          VANITY_HOST: ${{ vars.VANITY_HOST }}
          VANITY_TLS_CERTIFICATE: ${{ secrets.VANITY_TLS_CERTIFICATE }}
          VANITY_TLS_KEY: ${{ secrets.VANITY_TLS_KEY }}
          VANITY_TLS_CA_CERTIFICATE: ${{ secrets.VANITY_TLS_CA_CERTIFICATE }}
        run: |
          set -euo pipefail
          # The namespace check above then requires a -prod namespace.
          if [[ "$DEPLOY_ENV" != prod ]]; then
            echo "::error::PROD requires the prod GitHub Environment"
            exit 1
          fi
          for setting in VANITY_HOST VANITY_TLS_CERTIFICATE VANITY_TLS_KEY VANITY_TLS_CA_CERTIFICATE; do
            if [[ -z "${!setting}" ]]; then
              echo "::error::${setting} must be configured in the prod GitHub Environment"
              exit 1
            fi
          done
          if [[ ! "$VANITY_HOST" =~ ^[A-Za-z0-9][A-Za-z0-9.-]*[A-Za-z0-9]$ ]]; then
            echo "::error::VANITY_HOST must be a hostname without a scheme or path"
            exit 1
          fi
      # Secret values go through env, never into `parameters`: the action pastes
      # the parameters string verbatim into bash (`oc process ... ${parameters}`),
      # so a quote or $(...) inside a secret would escape the quoting there.
      - uses: bcgov/action-deployer-openshift@e2d60eb9cacceb89c3b97d8dcf0a2c460eea5eab # v4.2.3
        id: deploy
        env:
          DB_USER: ${{ secrets.ORACLEDB_USERNAME }}
          DB_PASS: ${{ secrets.ORACLEDB_PASSWORD }}
          DB_HOST: ${{ secrets.ORACLEDB_HOST }}
          DB_SERVICENAME: ${{ secrets.ORACLEDB_SERVICENAME }}
        with:
          file: ${{ runner.temp }}/deploy-templates/init.yml
          oc_namespace: ${{ secrets.OC_NAMESPACE }}
          oc_server: ${{ vars.OC_SERVER }}
          oc_token: ${{ secrets.OC_TOKEN }}
          overwrite: true
          parameters:
            -p ZONE='${{ inputs.target }}'
            -p NAME='${{ github.event.repository.name }}'
            -p SPRING_DATASOURCE_USERNAME="$DB_USER"
            -p SPRING_DATASOURCE_PASSWORD="$DB_PASS"
            -p ORACLEDB_HOST="$DB_HOST"
            -p ORACLEDB_SERVICENAME="$DB_SERVICENAME"
            -p ILCR_OIDC_ISSUER_URI='${{ vars.ILCR_OIDC_ISSUER_URI }}'
            -p ILCR_OIDC_CLIENT_ID='${{ vars.ILCR_OIDC_CLIENT_ID }}'
            -p APP_ENV='${{ inputs.environment || 'dev' }}'
            -p OIDC_SITEMINDER_LOGOUT_URL='${{ vars.ILCR_OIDC_SITEMINDER_LOGOUT_URL }}'
            $OC_PROCESS_FLAGS
          debug: false
          triggers: ${{ inputs.triggers }}

  deploy:
    name: Deploy (${{ matrix.name }})
    environment:
      name: ${{ inputs.environment }}
      deployment: ${{ inputs.target != 'prod' }}
    needs: [init]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 15
    strategy:
      # Roll out the backend before the frontend: one leg at a time in matrix order, and
      # fail-fast cancels the queued frontend leg if the backend leg fails.
      max-parallel: 1
      fail-fast: true
      matrix:
        name: [backend, frontend]
        include:
          - name: backend
            # Oracle host/servicename are environment-scoped SECRETS, passed
            # through the init job above (env-scoped secrets don't resolve in
            # this matrix — GitHub evaluates it before the environment
            # attaches) into the backend Secret. ILCR_SECURITY_ENABLED is
            # hardcoded "true" in the backend template — deployed pods always
            # enforce auth.
            parameters: -p IMAGE_TAG="${{ inputs.tag }}"
              -p ILCR_DATASOURCE_ENABLED="${{ vars.ILCR_DATASOURCE_ENABLED || 'true' }}"
          # The frontend takes no extra parameters: its auth settings come from the init ConfigMaps.
    outputs:
      triggered: ${{ steps.deploy.outputs.triggered }}
    env:
      IMAGE_REF: ${{ matrix.name == 'backend' && (inputs.backend_image || format('ghcr.io/{0}/backend:{1}', github.repository, inputs.tag)) || (inputs.frontend_image || format('ghcr.io/{0}/frontend:{1}', github.repository, inputs.tag)) }}
      VANITY_HOST: ${{ vars.VANITY_HOST }}
      APPS_DOMAIN: ${{ vars.OPENSHIFT_APPS_DOMAIN || 'apps.gold.devops.gov.bc.ca' }}
    steps:
      # Each job resolves its environment secrets separately; see the init job.
      - name: Validate OpenShift namespace
        if: ${{ inputs.environment != '' }}
        env:
          DEPLOY_ENV: ${{ inputs.environment }}
          OC_NAMESPACE: ${{ secrets.OC_NAMESPACE }}
        run: |
          if [[ "$OC_NAMESPACE" != *-"$DEPLOY_ENV" ]]; then
            echo "::error title=Wrong OpenShift namespace::OC_NAMESPACE must be the ${DEPLOY_ENV} namespace, ending in -${DEPLOY_ENV}."
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ inputs.source_ref || github.sha }}
      - name: Stage deployment templates
        env:
          COMPONENT: ${{ matrix.name }}
        run: |
          mkdir -p "$RUNNER_TEMP/deploy-templates"
          cp "$COMPONENT/openshift.deploy.yml" "$RUNNER_TEMP/deploy-templates/$COMPONENT.yml"
          if [[ "$COMPONENT" == frontend ]]; then
            cp frontend/openshift.route.yml "$RUNNER_TEMP/deploy-templates/route.yml"
            cp frontend/openshift.vanity-route.yml "$RUNNER_TEMP/deploy-templates/vanity-route.yml"
          fi
      - uses: bcgov/action-deployer-openshift@e2d60eb9cacceb89c3b97d8dcf0a2c460eea5eab # v4.2.3
        id: deploy
        with:
          file: ${{ runner.temp }}/deploy-templates/${{ matrix.name }}.yml
          oc_namespace: ${{ secrets.OC_NAMESPACE }}
          oc_server: ${{ vars.OC_SERVER }}
          oc_token: ${{ secrets.OC_TOKEN }}
          # Lite mode strips HPA + PDB and scales to 1 replica (Recreate) for PR/sandbox deploys
          lite_mode: ${{ github.event_name == 'pull_request' }}
          parameters: -p ZONE="${{ inputs.target }}"
            -p NAME="${{ github.event.repository.name }}"
            -p IMAGE_REF="$IMAGE_REF"
            -p ROLLOUT_TRIGGER="${{ github.run_id }}-${{ github.run_attempt }}"
            ${{ matrix.parameters }}
            $OC_PROCESS_FLAGS
          triggers: ${{ inputs.triggers }}

      - name: Default Route (non-PROD)
        if: ${{ matrix.name == 'frontend' && inputs.target != 'prod' }}
        uses: bcgov/action-deployer-openshift@e2d60eb9cacceb89c3b97d8dcf0a2c460eea5eab # v4.2.3
        with:
          file: ${{ runner.temp }}/deploy-templates/route.yml
          oc_namespace: ${{ secrets.OC_NAMESPACE }}
          oc_server: ${{ vars.OC_SERVER }}
          oc_token: ${{ secrets.OC_TOKEN }}
          overwrite: true
          debug: false
          parameters:
            -p NAME="${{ github.event.repository.name }}"
            -p ZONE="${{ inputs.target }}"
            -p DOMAIN="$APPS_DOMAIN"
          triggers: ${{ inputs.triggers }}
      - name: Vanity Route (PROD)
        if: ${{ matrix.name == 'frontend' && inputs.target == 'prod' }}
        uses: bcgov/action-deployer-openshift@e2d60eb9cacceb89c3b97d8dcf0a2c460eea5eab # v4.2.3
        env:
          VANITY_TLS_CERTIFICATE: ${{ secrets.VANITY_TLS_CERTIFICATE }}
          VANITY_TLS_KEY: ${{ secrets.VANITY_TLS_KEY }}
          VANITY_TLS_CA_CERTIFICATE: ${{ secrets.VANITY_TLS_CA_CERTIFICATE }}
        with:
          file: ${{ runner.temp }}/deploy-templates/vanity-route.yml
          oc_namespace: ${{ secrets.OC_NAMESPACE }}
          oc_server: ${{ vars.OC_SERVER }}
          oc_token: ${{ secrets.OC_TOKEN }}
          overwrite: true
          debug: false
          parameters:
            -p NAME="${{ github.event.repository.name }}"
            -p ZONE="${{ inputs.target }}"
            -p VANITY_HOST="$VANITY_HOST"
            -p VANITY_TLS_CERTIFICATE="$VANITY_TLS_CERTIFICATE"
            -p VANITY_TLS_KEY="$VANITY_TLS_KEY"
            -p VANITY_TLS_CA_CERTIFICATE="$VANITY_TLS_CA_CERTIFICATE"
            $OC_PROCESS_FLAGS

  # Shared Oracle in the TOOLS namespace, deployed only after the backend and
  # frontend so app deploys never wait on it. One instance serves every zone
  # (ZONE=tools), so this is idempotent: overwrite=false means `oc create` —
  # an existing database is left untouched and its data survives. To roll a
  # new image or template change, delete the deployment in the tools
  # namespace and re-run.
  #
  # No `environment:` here — the tools namespace is shared across dev/test,
  # so OC_NAMESPACE_TOOLS, OC_TOKEN_TOOLS and TOOLS_ORACLEDB_PASSWORD are
  # repo-level secrets (via `secrets: inherit`).
  deploy-database:
    if: ${{ inputs.target != 'prod' }}
    name: Deploy (database)
    needs: [deploy]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      # The template's NetworkPolicy needs the license plate to admit the
      # product's dev/test namespaces; derive it instead of adding a secret.
      - name: Derive license plate
        env:
          NS_TOOLS: ${{ secrets.OC_NAMESPACE_TOOLS }}
        run: |
          LICENSE_PLATE="${NS_TOOLS%-tools}"
          echo "::add-mask::$LICENSE_PLATE"
          echo "LICENSE_PLATE=$LICENSE_PLATE" >> $GITHUB_ENV
      - uses: bcgov/action-deployer-openshift@e2d60eb9cacceb89c3b97d8dcf0a2c460eea5eab # v4.2.3
        id: deploy
        env:
          DB_PASS: ${{ secrets.TOOLS_ORACLEDB_PASSWORD }}
        with:
          file: database/openshift.deploy.yml
          oc_namespace: ${{ secrets.OC_NAMESPACE_TOOLS }}
          oc_server: ${{ vars.OC_SERVER }}
          oc_token: ${{ secrets.OC_TOKEN_TOOLS }}
          overwrite: false
          parameters:
            -p ZONE=tools
            -p NAME='${{ github.event.repository.name }}'
            -p IMAGE_TAG='${{ inputs.tag }}'
            -p ORACLEDB_PASSWORD="$DB_PASS"
            -p LICENSE_PLATE="$LICENSE_PLATE"
          triggers: ${{ inputs.triggers }}
