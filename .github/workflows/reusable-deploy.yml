# Reusable Deploy - Lite Mode Verification
name: Reusable Deploy

on:
  workflow_call:
    inputs:
      environment:
        description: GitHub/OpenShift environment
        default: ""
        type: string
      target:
        description: Deployment target; usually PR number, test or prod
        default: ${{ github.event.number }}
        type: string
      tag:
        description: Container tag
        default: ${{ github.event.number }}
        type: string
      triggers:
        description: Triggers for deployment
        default: ""
        type: string

    # Secrets come via `secrets: inherit` so environment-scoped values
    # (test/prod) resolve correctly; a `uses:` job cannot set `environment:`,
    # so explicitly passed secrets would only ever see repo-level values.

    outputs:
      triggered:
        description: Has deployment been triggered?
        value: ${{ jobs.init.outputs.triggered }}

permissions: {}

jobs:
  init:
    name: Deploy (init)
    environment: ${{ inputs.environment }}
    outputs:
      triggered: ${{ steps.deploy.outputs.triggered }}
    runs-on: ubuntu-24.04
    # Secret values go through env, never into `parameters`: the action pastes
    # the parameters string verbatim into bash (`oc process ... ${parameters}`),
    # so a quote or $(...) inside a secret would escape the quoting there.
    env:
      DB_USER: ${{ secrets.ORACLEDB_USERNAME }}
      DB_PASS: ${{ secrets.ORACLEDB_PASSWORD }}
      COGNITO_POOL: ${{ secrets.USER_POOLS_ID }}
    steps:
      - uses: bcgov/action-deployer-openshift@27a85b7b157bfc9c3c9bf0aca53bcd288d4d2506 # v4.2.1
        id: deploy
        with:
          file: common/openshift.init.yml
          oc_namespace: ${{ secrets.OC_NAMESPACE }}
          oc_server: ${{ vars.OC_SERVER }}
          oc_token: ${{ secrets.OC_TOKEN }}
          overwrite: true
          parameters:
            -p ZONE='${{ inputs.target }}'
            -p NAME='${{ github.event.repository.name }}'
            -p SPRING_DATASOURCE_USERNAME="$DB_USER"
            -p SPRING_DATASOURCE_PASSWORD="$DB_PASS"
            -p COGNITO_USER_POOL="$COGNITO_POOL"
          triggers: ${{ inputs.triggers }}

  # Fixture-seeded Oracle in the shared -tools namespace (waste-plus `legacydb`
  # pattern; see database/README.md). One instance serves every zone, so it is
  # provisioned create-once (overwrite: false) — only the Flyway migration Job,
  # named per-run via MIGRATE_SUFFIX, is created fresh on each deploy.
  database:
    name: Deploy (database)
    environment: ${{ inputs.environment }}
    needs: [init]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DB_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
      OC_NS_TOOLS: ${{ secrets.OC_NAMESPACE_TOOLS }}
    outputs:
      triggered: ${{ steps.deploy.outputs.triggered }}
    steps:
      - uses: bcgov/action-deployer-openshift@27a85b7b157bfc9c3c9bf0aca53bcd288d4d2506 # v4.2.1
        id: deploy
        with:
          file: database/openshift.deploy.yml
          oc_namespace: ${{ secrets.OC_NAMESPACE_TOOLS }}
          oc_server: ${{ vars.OC_SERVER }}
          oc_token: ${{ secrets.OC_TOKEN_TOOLS }}
          # oc create semantics: existing objects are left alone (AlreadyExists
          # tolerated); the per-run migration Job is the only new object
          overwrite: false
          parameters: -p ZONE=tools
            -p NAME='${{ github.event.repository.name }}'
            -p IMAGE_TAG='${{ inputs.tag }}'
            -p MIGRATE_SUFFIX='${{ github.run_id }}-${{ github.run_attempt }}'
            -p DATABASE_PASSWORD="$DB_PASSWORD"
            -p DEV_NAMESPACE="${OC_NS_TOOLS%-*}-dev"
          triggers: ${{ inputs.triggers }}
      - name: Wait for fixture migration
        if: steps.deploy.outputs.triggered == 'true'
        uses: bcgov/action-oc-runner@111868d1fc50db0a40417ba321d865ef5c931bbd # v1.7.0
        with:
          oc_namespace: ${{ secrets.OC_NAMESPACE_TOOLS }}
          oc_server: ${{ vars.OC_SERVER }}
          oc_token: ${{ secrets.OC_TOKEN_TOOLS }}
          commands: |
            JOB=${{ github.event.repository.name }}-tools-database-migrate-${{ github.run_id }}-${{ github.run_attempt }}
            # Poll both terminal conditions: `oc wait --for=condition=complete`
            # alone would block the full timeout on a job that already failed
            for i in $(seq 1 90); do
              STATUS=$(oc get job/${JOB} -o jsonpath='{range .status.conditions[?(@.status=="True")]}{.type}{end}' 2>&1) || {
                echo "Migration job ${JOB} not found (was its creation rejected?): ${STATUS}"; exit 1; }
              case "${STATUS}" in
                *Complete*) echo "Fixture migration complete."; exit 0 ;;
                *Failed*)   echo "Fixture migration FAILED; logs:";
                            oc logs job/${JOB} --all-containers --tail=200 || true; exit 1 ;;
                *)          echo "Waiting for fixture migration (${i}/90)..."; sleep 10 ;;
              esac
            done
            echo "Fixture migration timed out; logs:"
            oc logs job/${JOB} --all-containers --tail=200 || true
            exit 1

  deploy:
    name: Deploy (${{ matrix.name }})
    environment: ${{ inputs.environment }}
    needs: [init, database]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      matrix:
        name: [backend, frontend]
        include:
          - name: backend
            file: backend/openshift.deploy.yml
            # Security and datasource flags come from GitHub vars, resolved
            # environment-first, and FAIL CLOSED: auth is enforced unless a
            # var explicitly opts a scope out. The backend refuses to start
            # with security off and the datasource on (DeployedSecurityGuard),
            # so a mock-auth deployment requires disabling both — mock auth
            # never fronts real data.
            parameters: -p IMAGE_TAG="${{ inputs.tag }}"
              -p ORACLEDB_HOST="${{ vars.ORACLEDB_HOST }}"
              -p ORACLEDB_SERVICENAME="${{ vars.ORACLEDB_SERVICENAME }}"
              -p ILCR_SECURITY_ENABLED="${{ vars.ILCR_SECURITY_ENABLED || 'true' }}"
              -p ILCR_DATASOURCE_ENABLED="${{ vars.ILCR_DATASOURCE_ENABLED || 'true' }}"
          - name: frontend
            file: frontend/openshift.deploy.yml
            parameters: -p IMAGE_TAG="${{ inputs.tag }}"
    outputs:
      triggered: ${{ steps.deploy.outputs.triggered }}
    steps:
      - uses: bcgov/action-deployer-openshift@27a85b7b157bfc9c3c9bf0aca53bcd288d4d2506 # v4.2.1
        id: deploy
        with:
          file: ${{ matrix.file }}
          oc_namespace: ${{ secrets.OC_NAMESPACE }}
          oc_server: ${{ vars.OC_SERVER }}
          oc_token: ${{ secrets.OC_TOKEN }}
          # Lite mode strips HPA + PDB and scales to 1 replica (Recreate) for PR/sandbox deploys
          lite_mode: ${{ github.event_name == 'pull_request' }}
          parameters: -p ZONE="${{ inputs.target }}"
            -p NAME="${{ github.event.repository.name }}"
            ${{ matrix.parameters }}
          triggers: ${{ inputs.triggers }}
