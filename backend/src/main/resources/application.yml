spring:
  application:
    name: nr-ilcr-backend
  jackson:
    default-property-inclusion: non_null
    deserialization:
      # Money must never be silently truncated. Jackson enables ACCEPT_FLOAT_AS_INT by default, so a
      # cost of 1234.99 posted into an Integer field binds as 1234 and the licensee is told the save
      # succeeded -- with a different number than they typed. Story 7.2 AC6 requires such input to be
      # REJECTED, and the same latent truncation was already recorded repo-wide at
      # deferred-work.md:180; turning the feature off closes it for every schedule at once rather
      # than leaving Schedule 5 the only safe one.
      accept-float-as-int: false
  datasource:
    url: ${SPRING_DATASOURCE_URL:}
    username: ${SPRING_DATASOURCE_USERNAME:}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      pool-name: ${SPRING_DATASOURCE_POOL_NAME:ILCROraclePool}
      minimum-idle: ${SPRING_DATASOURCE_MIN_IDLE:1}
      maximum-pool-size: ${SPRING_DATASOURCE_MAX_POOL_SIZE:5}
      connection-timeout: ${SPRING_DATASOURCE_CONNECTION_TIMEOUT:30000}
      idle-timeout: ${SPRING_DATASOURCE_IDLE_TIMEOUT:60000}
      max-lifetime: ${SPRING_DATASOURCE_MAX_LIFETIME:180000}
      keepalive-time: ${SPRING_DATASOURCE_KEEPALIVE_TIME:60000}
      leak-detection-threshold: ${SPRING_DATASOURCE_LEAK_DETECTION_THRESHOLD:60000}

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      base-path: /api
      discovery:
        enabled: false
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  info:
    env:
      enabled: true

info:
  app:
    name: nr-ilcr-backend
    version: ${APP_VERSION:0.0.1-SNAPSHOT}

ilcr:
  version: ${APP_VERSION:0.0.1-SNAPSHOT}
  security:
    enabled: ${ILCR_SECURITY_ENABLED:false}
  datasource:
    enabled: ${ILCR_DATASOURCE_ENABLED:false}
    validation-query: ${ILCR_DATASOURCE_VALIDATION_QUERY:SELECT 1 FROM DUAL}

features:
  flags:
    offline-mode-enabled: ${FEATURE_OFFLINE_MODE_ENABLED:false}

logging:
  level:
    root: ${LOG_LEVEL:INFO}

---
spring:
  config:
    activate:
      on-profile: oracle
  data:
    jdbc:
      repositories:
        enabled: true
  # TCPS URL composed from parts; trust material is scoped to the JDBC
  # connection via URL properties (waste-plus pattern) so the JVM default
  # truststore stays intact for public HTTPS calls (e.g. OIDC JWKS).
  datasource:
    url: jdbc:oracle:thin:@tcps://${ORACLEDB_HOST:localhost}:${ORACLEDB_PORT:1543}/${ORACLEDB_SERVICENAME:ilcr}?javax.net.ssl.trustStore=${ORACLEDB_KEYSTORE:/cert/jssecacerts}&javax.net.ssl.trustStorePassword=${ORACLEDB_SECRET:changeit}&javax.net.ssl.keyStore=${ORACLEDB_KEYSTORE:/cert/jssecacerts}&javax.net.ssl.keyStorePassword=${ORACLEDB_SECRET:changeit}

ilcr:
  datasource:
    enabled: true

---
# Local dev only. Active under the `dev` Spring profile, which the `dev` Maven profile turns on
# automatically (mvn spring-boot:run -Pdev; see pom.xml, which also adds DevTools only under -Pdev).
# DevTools ships DevToolsDataSourceAutoConfiguration, which hard-references
# org.springframework.boot.jdbc.autoconfigure.DataSourceProperties from Boot 4's spring-boot-jdbc
# module. We build the DataSource ourselves (see DataSourceConfiguration), so that module — and the
# class — isn't on the classpath and the autoconfig fails to load. Its only job is resetting an
# embedded/in-memory DB across restarts, meaningless against our external Oracle. Exclude it so the
# DevTools restart/live-reload features still work. Never active in prod (the `dev` profile isn't on,
# and DevTools isn't on the packaged-jar classpath there anyway). Kept as an on-profile document in the
# tracked application.yml because standalone application-dev.yml is gitignored (local-override slot).
spring:
  config:
    activate:
      on-profile: dev
  autoconfigure:
    exclude:
      - org.springframework.boot.devtools.autoconfigure.DevToolsDataSourceAutoConfiguration
