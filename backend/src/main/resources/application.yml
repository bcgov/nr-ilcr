spring:
  application:
    name: nr-ilcr-backend
  jackson:
    default-property-inclusion: non_null
    # Pin JSON date serialization to Pacific for any zoned value. Note the API surface is almost
    # entirely LocalDate/LocalDateTime (zone-less), so this is close to a no-op today; the JVM default
    # set in IlcrBackendApplication.main() is what actually fixes date boundaries. Kept for the zoned
    # cases (e.g. java.util.Date/SYSDATE) and so serialization can't drift from the JVM zone.
    time-zone: America/Vancouver
    deserialization:
      # Money must never be silently truncated. Jackson enables ACCEPT_FLOAT_AS_INT by default, so a
      # cost of 1234.99 posted into an Integer field binds as 1234 and the licensee is told the save
      # succeeded -- with a different number than they typed. Story 7.2 AC6 requires such input to be
      # REJECTED, and the same latent truncation was already recorded repo-wide at
      # deferred-work.md:180; turning the feature off closes it for every schedule at once rather
      # than leaving Schedule 5 the only safe one.
      accept-float-as-int: false
  mvc:
    async:
      # Story 29.2 — report/print PDFs now stream via StreamingResponseBody, so the export runs under
      # the async request clock. Set it EXPLICITLY (rather than inheriting the container default) so a
      # slow or large "all schedules" render has a deliberate ceiling. On timeout Spring completes the
      # response; for an already-committed streamed PDF that means a truncated body (logged at ERROR in
      # ReportController) — so size this to the worst-case render, not tight. 120s covers a big combined
      # print with headroom; raise via SPRING_MVC_ASYNC_REQUEST_TIMEOUT if a legitimate render exceeds it.
      request-timeout: ${SPRING_MVC_ASYNC_REQUEST_TIMEOUT:120000}
  datasource:
    url: ${SPRING_DATASOURCE_URL:}
    username: ${SPRING_DATASOURCE_USERNAME:}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      pool-name: ${SPRING_DATASOURCE_POOL_NAME:ILCROraclePool}
      minimum-idle: ${SPRING_DATASOURCE_MIN_IDLE:1}
      maximum-pool-size: ${SPRING_DATASOURCE_MAX_POOL_SIZE:5}
      connection-timeout: ${SPRING_DATASOURCE_CONNECTION_TIMEOUT:30000}
      idle-timeout: ${SPRING_DATASOURCE_IDLE_TIMEOUT:60000}
      max-lifetime: ${SPRING_DATASOURCE_MAX_LIFETIME:180000}
      keepalive-time: ${SPRING_DATASOURCE_KEEPALIVE_TIME:60000}
      leak-detection-threshold: ${SPRING_DATASOURCE_LEAK_DETECTION_THRESHOLD:60000}
    # Story 29.1 — a SEPARATE, small pool dedicated to the Jasper report-fill path (the Schedule 9
    # SQL-in-template fill borrows a JDBC connection for the whole render). Same DB (url/username/
    # password above) but its own small ceiling, so a burst of concurrent report renders can only
    # exhaust THIS pool — never the transactional pool that serves ordinary schedule requests. Size it
    # to peak concurrent report renders (default 3). Short connection-timeout (5s) so the Nth queued
    # render fast-fails instead of parking a Tomcat thread for 30s. No leak-detection: a render
    # legitimately holds its connection for the full fill+format. Connections are marked read-only as a
    # HINT / intent signal (defence-in-depth) — it is not enforced write-prevention on Oracle.
    reporting:
      hikari:
        pool-name: ${SPRING_DATASOURCE_REPORTING_POOL_NAME:ILCRReportingPool}
        minimum-idle: ${SPRING_DATASOURCE_REPORTING_MIN_IDLE:0}
        maximum-pool-size: ${SPRING_DATASOURCE_REPORTING_MAX_POOL_SIZE:3}
        connection-timeout: ${SPRING_DATASOURCE_REPORTING_CONNECTION_TIMEOUT:5000}

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      base-path: /api
      discovery:
        enabled: false
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  info:
    env:
      enabled: true

info:
  app:
    name: nr-ilcr-backend
    version: ${APP_VERSION:0.0.1-SNAPSHOT}

ilcr:
  version: ${APP_VERSION:0.0.1-SNAPSHOT}
  security:
    enabled: ${ILCR_SECURITY_ENABLED:false}
  datasource:
    enabled: ${ILCR_DATASOURCE_ENABLED:false}
    validation-query: ${ILCR_DATASOURCE_VALIDATION_QUERY:SELECT 1 FROM DUAL}
  # NR User Lookup API (DL-27) — the directory behind the assignment picker. Off by default and in
  # every environment until the service account exists; the client credential is a per-environment
  # Vault secret injected as env vars, never a value in source or in this file.
  user-lookup:
    enabled: ${ILCR_USER_LOOKUP_ENABLED:false}
    base-url: ${ILCR_USER_LOOKUP_BASE_URL:}
    token-url: ${ILCR_USER_LOOKUP_TOKEN_URL:}
    client-id: ${ILCR_USER_LOOKUP_CLIENT_ID:}
    client-secret: ${ILCR_USER_LOOKUP_CLIENT_SECRET:}
    # Explicit ceilings on the app's only outbound HTTP dependency, which another ministry team
    # owns. The read timeout is the load-bearing one: a directory that accepts the connection and
    # then hangs would otherwise pin a servlet thread per picker keystroke until the pool is gone,
    # taking the local assignments view down with it -- the exact coupling the 502 degradation
    # exists to prevent. Sized for a directory search, not a report render.
    connect-timeout: ${ILCR_USER_LOOKUP_CONNECT_TIMEOUT:5s}
    read-timeout: ${ILCR_USER_LOOKUP_READ_TIMEOUT:10s}
  reporting:
    # Story 29.2 — the Jasper swap-file virtualizer that spills report page objects to disk under a
    # large or combined ("all schedules") fill, so the section object graph never pins the JVM heap.
    virtualizer:
      # swap-directory: where the per-render swap file lives. Empty → the JVM temp dir (java.io.tmpdir).
      # In OpenShift the container root fs is read-only AND /tmp is a MEMORY-backed emptyDir, so the
      # deploy sets ILCR_REPORTING_SWAP_DIR to a dedicated DISK-backed ephemeral volume (see
      # backend/openshift.deploy.yml) — otherwise "spill to disk" would spill to RAM and defeat the
      # whole point. The file is created eagerly per render and deleted when the render finishes.
      swap-directory: ${ILCR_REPORTING_SWAP_DIR:}
      # max-size: pages kept in memory before the least-recently-used ones page out to the swap file.
      # A deliberate, conservative default (a page count, not a measured byte budget): high enough that
      # an ordinary single-schedule print never pages out (avoiding swap churn on the common path), low
      # enough to bound heap on a big combined print. Tune via ILCR_REPORTING_VIRTUALIZER_MAX_SIZE if
      # profiling shows a real workload wants a different ceiling. (The spill path itself is proven by
      # ReportVirtualizerSpillIT, which forces max-size=1.)
      max-size: ${ILCR_REPORTING_VIRTUALIZER_MAX_SIZE:300}

features:
  flags:
    offline-mode-enabled: ${FEATURE_OFFLINE_MODE_ENABLED:false}

logging:
  level:
    root: ${LOG_LEVEL:INFO}

---
spring:
  config:
    activate:
      on-profile: oracle
  data:
    jdbc:
      repositories:
        enabled: true
  # TCPS URL composed from parts; trust material is scoped to the JDBC
  # connection via URL properties (waste-plus pattern) so the JVM default
  # truststore stays intact for public HTTPS calls (e.g. OIDC JWKS).
  datasource:
    url: jdbc:oracle:thin:@tcps://${ORACLEDB_HOST:localhost}:${ORACLEDB_PORT:1543}/${ORACLEDB_SERVICENAME:ilcr}?javax.net.ssl.trustStore=${ORACLEDB_KEYSTORE:/cert/jssecacerts}&javax.net.ssl.trustStorePassword=${ORACLEDB_SECRET:changeit}&javax.net.ssl.keyStore=${ORACLEDB_KEYSTORE:/cert/jssecacerts}&javax.net.ssl.keyStorePassword=${ORACLEDB_SECRET:changeit}

ilcr:
  datasource:
    enabled: true

---
# Local dev only. Active under the `dev` Spring profile, which the `dev` Maven profile turns on
# automatically (mvn spring-boot:run -Pdev; see pom.xml, which also adds DevTools only under -Pdev).
# DevTools ships DevToolsDataSourceAutoConfiguration, which hard-references
# org.springframework.boot.jdbc.autoconfigure.DataSourceProperties from Boot 4's spring-boot-jdbc
# module. We build the DataSource ourselves (see DataSourceConfiguration), so that module — and the
# class — isn't on the classpath and the autoconfig fails to load. Its only job is resetting an
# embedded/in-memory DB across restarts, meaningless against our external Oracle. Exclude it so the
# DevTools restart/live-reload features still work. Never active in prod (the `dev` profile isn't on,
# and DevTools isn't on the packaged-jar classpath there anyway). Kept as an on-profile document in the
# tracked application.yml because standalone application-dev.yml is gitignored (local-override slot).
spring:
  config:
    activate:
      on-profile: dev
  autoconfigure:
    exclude:
      - org.springframework.boot.devtools.autoconfigure.DevToolsDataSourceAutoConfiguration
