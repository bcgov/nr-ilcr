# page or road detail was unreachable. Mirrors culvertNotFoundErrorMsg / bridgeNotFoundErrorMsg.
constructionPageNotFoundErrorMsg=Construction page not found.
roadDetailNotFoundErrorMsg=Road detail not found.
# --- Story 11.2 code review (2026-08-18): the FLD-005 required set, resolved legacy-first ---
# Legacy overrides NO javax.faces.* key, so JSF's own template "{0}: Value is required." fills {0}
# from each component's label attribute. Bean Validation has no positional arguments, so attaching
# the parameterised key to an annotation shipped a literal "{0}" to the reporter. These four keys
# carry the resolved text verbatim -- the label is legacy's, the key name is ours. Component labels:
# pageDtlRIRoadType, addBiogeoAutoComplete, pageDtlASCode, pageDtlASType (schedule10.xhtml).
roadTypeRequiredErrorMsg=Road Type: Value is required.
becZoneRequiredErrorMsg=BEC Zone: Value is required.
ballastMethodRequiredErrorMsg=Ballast Method Code: Value is required.
materialCodeTypeRequiredErrorMsg=Material Code Type: Value is required.
# --- Story 11.2 code review (2026-08-18): FLD-009 bounds, resolved legacy-first ---
# invalidRangeErrorMsg is parameterised ("between {0} and {1}") and legacy uses it in exactly ONE
# place -- CheckStatus.java:196, with an args array. Legacy's SAVE path leaves dimensions to
# <f:validateDoubleRange> with no validatorMessage, so JSF renders its own template with the bounds
# filled. Wiring the parameterised key to Bean Validation shipped a literal "{0} and {1}" instead.
# One key per distinct band, each rendering the bytes legacy's own Check Status emits for the same
# field. Bounds are unseparated, matching both the validateDoubleRange minimum/maximum attributes
# and the ###.# / ###.### Check Status patterns.
#
# These cover DIMENSIONS ONLY, because those are the fields legacy has no text for. Everything that
# legacy DOES name keeps its legacy key and is NOT re-declared here: costs use
# costValidatorSchedule9ErrorMsg / costSize7ValidatorErrorMsg, volumes use volumeValidatorErrorMsg,
# the five material percentages use percentageValidatorErrorMsg:45, and side slope uses
# sideSlopePercentageValidatorErrorMsg:262 (both already in this bundle).
rangeZeroToOneHundredErrorMsg=Entered value must be between 0 and 100.
rangeZeroTo999Point9ErrorMsg=Entered value must be between 0 and 999.9.
rangeZeroTo999Point999ErrorMsg=Entered value must be between 0 and 999.999.
rangeZeroTo99Point9ErrorMsg=Entered value must be between 0 and 99.9.
rangeHaulDistanceErrorMsg=Entered value must be between -9999.9 and 9999.9.
# --- Story 11.2 code review (2026-08-18): converter keys, so a malformed number names its own field ---
# GlobalExceptionHandler picks a converter message from the target JAVA TYPE, so every Integer field
# answered costConverterErrorMsg ("Entered cost is invalid.") -- telling a reporter their COST is
# invalid when they mistyped a percentage or a volume. sideSlopePercentageConverterErrorMsg is
# VERBATIM legacy (its bundle :81). percentageConverterErrorMsg has no legacy analogue -- legacy's
# screen had no free-text percentage converter to fail -- so it follows the sibling *ConverterErrorMsg
# phrasing, the same recorded AD-8 deviation the three culvert keys above carry.
sideSlopePercentageConverterErrorMsg=Side slope (%): percentage is invalid.
percentageConverterErrorMsg=Entered percentage is invalid.
