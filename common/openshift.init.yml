apiVersion: template.openshift.io/v1
kind: Template
parameters:
  - name: NAME
    description: Product name
    value: nr-ilcr
  - name: ZONE
    description: Deployment zone, e.g. pr-### or prod
    required: true
  - name: SPRING_DATASOURCE_USERNAME
    description: Oracle database username
    required: true
  - name: SPRING_DATASOURCE_PASSWORD
    description: Oracle database password
    required: true
  # Stable, non-secret password: the keystore holds only the Oracle server's
  # public cert, and a rotating value would desync from the keystore already
  # built on the PVC (the app would fail to open it after a redeploy).
  - name: ORACLEDB_KEYSTORE_SECRET
    description: Password for the Oracle keystore built by the backend init container
    value: changeit
  - name: COGNITO_USER_POOL
    description: Cognito (FAM) user pool ID for JWT validation
    required: true
  - name: COGNITO_CLIENT_ID
    description: Cognito (FAM) web-client ID, validated as the ID token's aud
    required: true

  # ── Frontend amplify config ───────────────────────────────
  # Lives here (not in frontend/openshift.deploy.yml) so the values are
  # processed by the init step, where environment-scoped GitHub variables
  # resolve. The deploy job reads vars inside a matrix, which GitHub
  # evaluates before the environment is attached — env-scoped values are
  # silently ignored there. (Same pattern as nr-csp.)
  - name: COGNITO_DOMAIN
    description: Cognito hosted UI domain (no https://)
    required: true
  - name: COGNITO_OAUTH_SCOPES
    description: Comma-separated OAuth scopes
    value: openid
  - name: COGNITO_REDIRECT_SIGN_IN
    description: Post-login redirect URL (must be FAM-registered verbatim)
    required: true
  # Cognito validates logout_uri by exact string match against the FAM
  # client's registered sign-out URLs (FAM repo: lza-infrastructure/terraform/
  # server/oidc_clients_ilcr.tf). Dev PR hosts register only the plain
  # <app>/logout; test/prod also register the full SiteMinder → Keycloak →
  # app chain (see frontend/amplify-config.local.example.js for its shape).
  - name: COGNITO_REDIRECT_SIGN_OUT
    description: Post-logout redirect URL (must be FAM-registered verbatim)
    required: true
objects:
  # ── Backend Secret ────────────────────────────────────────
  - apiVersion: v1
    kind: Secret
    metadata:
      name: ${NAME}-${ZONE}-backend
      labels:
        app: ${NAME}-${ZONE}
    type: Opaque
    stringData:
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      ORACLEDB_KEYSTORE_SECRET: ${ORACLEDB_KEYSTORE_SECRET}
      COGNITO_USER_POOL: ${COGNITO_USER_POOL}
      COGNITO_CLIENT_ID: ${COGNITO_CLIENT_ID}

  # ── Frontend amplify ConfigMap (runtime-injected, mounted by the frontend
  #    Deployment over the repo's mock-auth placeholder public/amplify-config.js;
  #    see frontend/src/env.ts). Pool/client ids are public identifiers — every
  #    browser downloads this file — so surfacing them here is fine. ──
  - apiVersion: v1
    kind: ConfigMap
    metadata:
      name: ${NAME}-${ZONE}-frontend-amplify-config
      labels:
        app: ${NAME}-${ZONE}
    data:
      amplify-config.js: |
        window.amplifyConfig = {
          mockUser: false,
          userPoolId: '${COGNITO_USER_POOL}',
          userPoolClientId: '${COGNITO_CLIENT_ID}',
          cognitoDomain: '${COGNITO_DOMAIN}',
          oauthScopes: '${COGNITO_OAUTH_SCOPES}'.split(','),
          redirectSignIn: '${COGNITO_REDIRECT_SIGN_IN}',
          redirectSignOut: '${COGNITO_REDIRECT_SIGN_OUT}',
        }
  - apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    metadata:
      name: ${NAME}-${ZONE}-frontend-ingress
      labels:
        app: ${NAME}-${ZONE}
    spec:
      podSelector:
        matchLabels:
          deployment: ${NAME}-${ZONE}-frontend
      ingress:
        - from:
            - namespaceSelector:
                matchLabels:
                  network.openshift.io/policy-group: ingress
      policyTypes:
        - Ingress
  - apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    metadata:
      name: ${NAME}-${ZONE}-backend-ingress
      labels:
        app: ${NAME}-${ZONE}
    spec:
      podSelector:
        matchLabels:
          deployment: ${NAME}-${ZONE}-backend
      ingress:
        - from:
            - podSelector:
                matchLabels:
                  app: ${NAME}-${ZONE}
                  deployment: ${NAME}-${ZONE}-frontend
      policyTypes:
        - Ingress
