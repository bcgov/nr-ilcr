apiVersion: template.openshift.io/v1
kind: Template
parameters:
  - name: NAME
    description: Product name
    value: nr-ilcr
  - name: COMPONENT
    description: Component name
    value: database
  - name: ZONE
    description: Deployment zone; the shared TOOLS instance uses "tools"
    value: tools
  - name: IMAGE_TAG
    description: Image tag to use
    required: true
  - name: REGISTRY
    description: Container registry to import from
    value: ghcr.io
  - name: ORG_NAME
    description: Organization name
    value: bcgov
  - name: LICENSE_PLATE
    description: Six-character namespace license plate; used to allow ingress from this product's dev/test namespaces
    required: true
  - name: ORACLEDB_USER
    description: Application schema user, created by the image on first start. THE matches the backend's expected schema (see AbstractOracleIT).
    value: THE
  - name: ORACLEDB_PASSWORD
    description: Password for the application schema user
    required: true
  - name: ORACLEDB_DATABASE
    description: Extra pluggable database created on first start; its service name is what clients connect to
    value: ILCR
  - name: CPU_REQUEST
    value: "125m"
  - name: MEMORY_REQUEST
    value: "2Gi"
  - name: MEMORY_LIMIT
    value: "4Gi"
objects:
  # ── Database Secret ───────────────────────────────────────
  # SYS/SYSTEM get a random password (printed once in the pod log); only the
  # app user's credentials are kept, matching the ORACLEDB_* GitHub secrets
  # convention used elsewhere in this repo.
  - apiVersion: v1
    kind: Secret
    metadata:
      name: ${NAME}-${ZONE}-${COMPONENT}
      labels:
        app: ${NAME}-${ZONE}
    type: Opaque
    stringData:
      ORACLEDB_USER: ${ORACLEDB_USER}
      ORACLEDB_PASSWORD: ${ORACLEDB_PASSWORD}

  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: ${NAME}-${ZONE}-${COMPONENT}
      labels:
        app: ${NAME}-${ZONE}
    spec:
      replicas: 1
      selector:
        matchLabels:
          deployment: ${NAME}-${ZONE}-${COMPONENT}
      # Single-writer database with no PVC: data is deliberately ephemeral
      # (rebuilt by migrations/seeding), so Recreate avoids two instances
      # ever running at once.
      strategy:
        type: Recreate
      template:
        metadata:
          labels:
            app: ${NAME}-${ZONE}
            deployment: ${NAME}-${ZONE}-${COMPONENT}
        spec:
          terminationGracePeriodSeconds: 30
          # Oracle's OS groups: the image files stay owned by these GIDs while
          # the restricted SCC assigns the namespace-range UID (which the
          # Dockerfile maps onto the oracle user). Same as nr-waste-plus.
          securityContext:
            supplementalGroups:
              - 54321 # oinstall
              - 54322 # dba
              - 54323 # oper
              - 54324 # backupdba
              - 54325 # dgdba
              - 54326 # kmdba
              - 54330 # racdba
          containers:
            - name: ${NAME}
              image: ${REGISTRY}/${ORG_NAME}/${NAME}/${COMPONENT}:${IMAGE_TAG}
              imagePullPolicy: Always
              ports:
                - name: oracle
                  containerPort: 1521
                  protocol: TCP
              env:
                # Random SYS/SYSTEM password, printed once in the pod log.
                # Clients use the app user below.
                - name: ORACLE_RANDOM_PASSWORD
                  value: "true"
                - name: ORACLE_DATABASE
                  value: ${ORACLEDB_DATABASE}
                - name: APP_USER
                  valueFrom:
                    secretKeyRef:
                      name: ${NAME}-${ZONE}-${COMPONENT}
                      key: ORACLEDB_USER
                - name: APP_USER_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: ${NAME}-${ZONE}-${COMPONENT}
                      key: ORACLEDB_PASSWORD
              resources:
                requests:
                  cpu: ${CPU_REQUEST}
                  memory: ${MEMORY_REQUEST}
                  # Datafiles live on the container filesystem (no PVC); the
                  # extra PDB created on first start needs headroom here.
                  ephemeral-storage: "2Gi"
                limits:
                  memory: ${MEMORY_LIMIT}
              securityContext:
                allowPrivilegeEscalation: false
                runAsNonRoot: true
                # The database writes datafiles/logs under /opt/oracle inside
                # the container filesystem — ephemeral by design.
                readOnlyRootFilesystem: false
                capabilities:
                  drop: ["ALL"]
                seccompProfile:
                  type: RuntimeDefault
              # First boot creates the extra PDB and app user, which can take
              # several minutes on top of the image pull.
              startupProbe:
                exec:
                  command: [healthcheck.sh]
                periodSeconds: 15
                timeoutSeconds: 10
                failureThreshold: 40
              readinessProbe:
                exec:
                  command: [healthcheck.sh]
                periodSeconds: 30
                timeoutSeconds: 10
                failureThreshold: 3
              livenessProbe:
                exec:
                  command: [healthcheck.sh]
                periodSeconds: 30
                timeoutSeconds: 10
                failureThreshold: 5
  - apiVersion: v1
    kind: Service
    metadata:
      labels:
        app: ${NAME}-${ZONE}
      name: ${NAME}-${ZONE}-${COMPONENT}
    spec:
      ports:
        - name: oracle
          port: 1521
          protocol: TCP
          targetPort: 1521
      selector:
        deployment: ${NAME}-${ZONE}-${COMPONENT}
  # Cross-namespace access: BC Gov namespaces carry name/environment labels,
  # so this admits the product's own dev and test namespaces (PR and TEST
  # backends) plus jobs in the tools namespace itself, on 1521 only.
  - apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    metadata:
      name: ${NAME}-${ZONE}-${COMPONENT}-ingress
      labels:
        app: ${NAME}-${ZONE}
    spec:
      podSelector:
        matchLabels:
          deployment: ${NAME}-${ZONE}-${COMPONENT}
      ingress:
        - from:
            - namespaceSelector:
                matchLabels:
                  name: ${LICENSE_PLATE}
                  environment: dev
            - namespaceSelector:
                matchLabels:
                  name: ${LICENSE_PLATE}
                  environment: test
            - podSelector: {}
          ports:
            - protocol: TCP
              port: 1521
      policyTypes:
        - Ingress
