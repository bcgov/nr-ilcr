apiVersion: template.openshift.io/v1
kind: Template
parameters:
  - name: ROLLOUT_TRIGGER
    description: Deployment run and attempt; refresh mounted runtime configuration
    value: ""
  - name: IMAGE_REF
    description: Full container image reference; tested releases use a sha256 digest
    required: true
  - name: NAME
    description: Module name
    required: true
  - name: COMPONENT
    description: Component name
    value: frontend
  - name: ZONE
    description: Deployment zone, e.g. pr-### or prod
    required: true
  - name: MIN_REPLICAS
    description: The minimum amount of replicas for the horizontal pod autoscaler.
    value: "3"
  - name: MAX_REPLICAS
    description: The maximum amount of replicas for the horizontal pod autoscaler.
    value: "5"
  - name: CPU_REQUEST
    value: "20m"
  - name: MEMORY_REQUEST
    value: "64Mi"
  - name: MEMORY_LIMIT
    value: "128Mi"
  - name: LOG_LEVEL
    description: Caddy log level (debug|info|warn|error)
    value: "info"
objects:
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      labels:
        app: ${NAME}-${ZONE}
      name: ${NAME}-${ZONE}-${COMPONENT}
    spec:
      selector:
        matchLabels:
          deployment: ${NAME}-${ZONE}-${COMPONENT}
      strategy:
        type: RollingUpdate
      template:
        metadata:
          annotations:
            app.openshift.io/rollout-trigger: ${ROLLOUT_TRIGGER}
          labels:
            app: ${NAME}-${ZONE}
            deployment: ${NAME}-${ZONE}-${COMPONENT}
        spec:
          terminationGracePeriodSeconds: 30
          affinity:
            podAntiAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 100
                  podAffinityTerm:
                    labelSelector:
                      matchLabels:
                        deployment: ${NAME}-${ZONE}-${COMPONENT}
                    topologyKey: kubernetes.io/hostname
          initContainers:
            - name: wait-for-backend
              image: ${IMAGE_REF}
              command:
                - /bin/sh
                - -c
                - |
                  echo "Waiting for backend to be healthy..."
                  max_retries=30
                  attempt=1
                  until wget -q --spider http://${NAME}-${ZONE}-backend/api/health; do
                    if [ "$attempt" -ge "$max_retries" ]; then
                      echo "ERROR: Backend ${NAME}-${ZONE}-backend is not reachable/healthy after ${max_retries} attempts." >&2
                      exit 1
                    fi
                    echo "Backend not ready (attempt ${attempt}/${max_retries}), sleeping..."
                    attempt=$((attempt + 1))
                    sleep 2
                  done
                  echo "Backend is UP and healthy!"
              securityContext:
                allowPrivilegeEscalation: false
                runAsNonRoot: true
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
                seccompProfile:
                  type: RuntimeDefault
              volumeMounts:
                - name: caddy-data
                  mountPath: /tmp/caddy
          containers:
            - name: ${NAME}
              image: ${IMAGE_REF}
              imagePullPolicy: Always
              ports:
                - name: http
                  containerPort: 3000
                - name: health
                  containerPort: 3001
              env:
                - name: LOG_LEVEL
                  value: ${LOG_LEVEL}
                - name: BACKEND_URL
                  value: http://${NAME}-${ZONE}-backend
                # Environment-specific issuer also bounds browser token/discovery requests.
                - name: OIDC_ISSUER_URI
                  valueFrom:
                    configMapKeyRef:
                      name: ${NAME}-${ZONE}-backend-auth
                      key: ILCR_OIDC_ISSUER_URI
                # readOnlyRootFilesystem: true → redirect every writable path
                # onto an emptyDir. Caddy stores config/data under the XDG dirs
                # (mounted at /tmp/caddy); Coraza writes SecTmpDir/SecDataDir
                # under /tmp/coraza; generic temp files go to TMPDIR.
                - name: XDG_CONFIG_HOME
                  value: /tmp/caddy
                - name: XDG_DATA_HOME
                  value: /tmp/caddy
                - name: TMPDIR
                  value: /tmp/caddy
              resources:
                requests:
                  cpu: ${CPU_REQUEST}
                  memory: ${MEMORY_REQUEST}
                  ephemeral-storage: "100Mi"
                limits:
                  memory: ${MEMORY_LIMIT}
              securityContext:
                allowPrivilegeEscalation: false
                runAsNonRoot: true
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
                seccompProfile:
                  type: RuntimeDefault
              volumeMounts:
                - name: caddy-data
                  mountPath: /tmp/caddy
                - name: coraza-tmp
                  mountPath: /tmp/coraza
                # Overrides the image's mock-auth placeholder with the real
                # CSS (OIDC) settings; the ConfigMap is created by
                # common/openshift.init.yml (init step), where environment-scoped
                # GitHub variables resolve correctly.
                - name: runtime-config
                  mountPath: /srv/config.js
                  subPath: config.js
              startupProbe:
                httpGet:
                  path: /health
                  port: health
                periodSeconds: 5
                failureThreshold: 30
              readinessProbe:
                httpGet:
                  path: /health
                  port: health
                periodSeconds: 5
                failureThreshold: 3
              livenessProbe:
                httpGet:
                  path: /health
                  port: health
                periodSeconds: 10
                failureThreshold: 3
              lifecycle:
                preStop:
                  exec:
                    command: ["/bin/sleep", "10"]
          volumes:
            - name: caddy-data
              emptyDir:
                medium: Memory
                sizeLimit: 256Mi
            - name: coraza-tmp
              emptyDir:
                medium: Memory
                sizeLimit: 256Mi
            - name: runtime-config
              configMap:
                name: ${NAME}-${ZONE}-frontend-config
  - apiVersion: v1
    kind: Service
    metadata:
      labels:
        app: ${NAME}-${ZONE}
      name: ${NAME}-${ZONE}-${COMPONENT}
    spec:
      ports:
        - name: http
          port: 80
          targetPort: 3000
      selector:
        deployment: ${NAME}-${ZONE}-${COMPONENT}
  - apiVersion: autoscaling/v2
    kind: HorizontalPodAutoscaler
    metadata:
      labels:
        app: ${NAME}-${ZONE}
      name: ${NAME}-${ZONE}-${COMPONENT}
    spec:
      scaleTargetRef:
        apiVersion: apps/v1
        kind: Deployment
        name: ${NAME}-${ZONE}-${COMPONENT}
      minReplicas: ${{MIN_REPLICAS}}
      maxReplicas: ${{MAX_REPLICAS}}
      metrics:
        - type: Resource
          resource:
            name: cpu
            target:
              type: Utilization
              averageUtilization: 80
      behavior:
        scaleUp:
          stabilizationWindowSeconds: 30
          policies:
            - type: Percent
              value: 100
              periodSeconds: 60
          selectPolicy: Max
        scaleDown:
          stabilizationWindowSeconds: 300
          policies:
            - type: Percent
              value: 50
              periodSeconds: 60
          selectPolicy: Max
  - apiVersion: policy/v1
    kind: PodDisruptionBudget
    metadata:
      labels:
        app: ${NAME}-${ZONE}
      name: ${NAME}-${ZONE}-${COMPONENT}
    spec:
      maxUnavailable: 1
      selector:
        matchLabels:
          deployment: ${NAME}-${ZONE}-${COMPONENT}
